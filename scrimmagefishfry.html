<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volunteer Signup – August 7th</title>
<style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; padding:20px; }
    h1 { text-align:center; }
    .slot-card {
        background:white; padding:15px; margin:10px 0; border-radius:8px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    .job {
        margin:8px 0; padding:10px; background:#fafafa; border-radius:6px;
        border:1px solid #ddd;
    }
    button {
        padding:6px 12px; border:none; border-radius:5px; cursor:pointer;
        background:#007bff; color:white;
    }
    button:disabled { background:#999; cursor:not-allowed; }
    .taken { color:#b30000; font-weight:bold; }
    .available { color:#008000; font-weight:bold; }
</style>
</head>
<body>

<h1>Volunteer Signup – August 7th (4:30pm–8:30pm)</h1>

<div id="slots"></div>

<script>
const jobs = {
    "Concessions": 3,
    "Frying/Grilling": 3,
    "Drive Thru Runner": 1
};

const timeSlots = [
    "4:30 - 5:00", "5:00 - 5:30", "5:30 - 6:00", "6:00 - 6:30",
    "6:30 - 7:00", "7:00 - 7:30", "7:30 - 8:00", "8:00 - 8:30"
];

let signupData = {}; // Tracks selections

function renderSlots() {
    const container = document.getElementById("slots");
    container.innerHTML = "";

    timeSlots.forEach(slot => {
        const card = document.createElement("div");
        card.className = "slot-card";

        card.innerHTML = `<h3>${slot}</h3>`;

        Object.keys(jobs).forEach(job => {
            const taken = signupData[slot]?.[job] || 0;
            const capacity = jobs[job];
            const available = capacity - taken;

            const jobDiv = document.createElement("div");
            jobDiv.className = "job";

            jobDiv.innerHTML = `
                <strong>${job}</strong><br>
                <span class="${available > 0 ? 'available' : 'taken'}">
                    ${available > 0 ? available + " spots available" : "FULL"}
                </span><br>
                <button ${available === 0 ? "disabled" : ""} onclick="signup('${slot}','${job}')">
                    Volunteer for ${job}
                </button>
            `;

            card.appendChild(jobDiv);
        });

        container.appendChild(card);
    });

    // Cleanup slot
    const cleanupCard = document.createElement("div");
    cleanupCard.className = "slot-card";
    cleanupCard.innerHTML = `<h3>After Scrimmage (Cleanup)</h3>`;

    const taken = signupData["Cleanup"]?.count || 0;
    const available = 4 - taken;

    cleanupCard.innerHTML += `
        <div class="job">
            <strong>Cleanup</strong><br>
            <span class="${available > 0 ? 'available' : 'taken'}">
                ${available > 0 ? available + " spots available" : "FULL"}
            </span><br>
            <button ${available === 0 ? "disabled" : ""} onclick="signupCleanup()">
                Volunteer for Cleanup
            </button>
        </div>
    `;

    container.appendChild(cleanupCard);
}

function signup(slot, job) {
    // Prevent selecting two jobs in same time slot
    if (signupData[slot] && Object.keys(signupData[slot]).length > 0 && !signupData[slot][job]) {
        alert("You already selected a job for this time slot.");
        return;
    }

    signupData[slot] = signupData[slot] || {};
    signupData[slot][job] = (signupData[slot][job] || 0) + 1;

    renderSlots();
}

function signupCleanup() {
    signupData["Cleanup"] = signupData["Cleanup"] || { count: 0 };
    signupData["Cleanup"].count++;

    renderSlots();
}

renderSlots();
</script>

</body>
</html>
