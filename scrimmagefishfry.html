<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volunteer Signup – August 7th</title>
<style>
    body { font-family: Arial, sans-serif; background:#f7f7f7; padding:20px; }
    h1 { text-align:center; }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
    }
    th, td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: center;
    }
    th {
        background: #eaeaea;
    }
    input[type="text"] {
        padding: 6px;
        width: 250px;
        margin-bottom: 10px;
    }
    button {
        padding: 6px 12px;
        margin-top: 5px;
        background:#007bff;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
    }
    button:disabled {
        background:#999;
        cursor:not-allowed;
    }
</style>
</head>
<body>

<h1>Volunteer Signup – August 7th (4:30pm–8:30pm)</h1>

<label><strong>Your Name:</strong></label><br>
<input type="text" id="volName" placeholder="Enter your name"><br>

<table id="volTable">
    <thead>
        <tr>
            <th>Time Slot</th>
            <th>Concessions (3)</th>
            <th>Frying/Grilling (3)</th>
            <th>Drive Thru Runner (1)</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<h2>After Scrimmage Cleanup (4 spots)</h2>
<div id="cleanupDiv"></div>

<script>
const jobs = {
    "Concessions": 3,
    "Frying/Grilling": 3,
    "Drive Thru Runner": 1
};

const timeSlots = [
    "4:30 - 5:00", "5:00 - 5:30", "5:30 - 6:00", "6:00 - 6:30",
    "6:30 - 7:00", "7:00 - 7:30", "7:30 - 8:00", "8:00 - 8:30"
];

let signupData = {}; // { slot: { job: ["Name1","Name2"] } }
let cleanupList = [];

function renderTable() {
    const body = document.getElementById("tableBody");
    body.innerHTML = "";

    timeSlots.forEach(slot => {
        const row = document.createElement("tr");
        row.innerHTML = `<td><strong>${slot}</strong></td>`;

        Object.keys(jobs).forEach(job => {
            const names = signupData[slot]?.[job] || [];
            const capacity = jobs[job];
            const available = capacity - names.length;

            const cell = document.createElement("td");

            cell.innerHTML = `
                <div>${names.join("<br>") || "<em>No volunteers</em>"}</div>
                <button ${available === 0 ? "disabled" : ""} onclick="signup('${slot}','${job}')">
                    Sign Up
                </button>
            `;

            row.appendChild(cell);
        });

        body.appendChild(row);
    });

    // Cleanup section
    const cleanupDiv = document.getElementById("cleanupDiv");
    const availableCleanup = 4 - cleanupList.length;

    cleanupDiv.innerHTML = `
        <p><strong>Volunteers:</strong><br>${cleanupList.join("<br>") || "<em>No volunteers</em>"}</p>
        <button ${availableCleanup === 0 ? "disabled" : ""} onclick="signupCleanup()">
            Sign Up for Cleanup
        </button>
    `;
}

function signup(slot, job) {
    const name = document.getElementById("volName").value.trim();
    if (!name) {
        alert("Please enter your name before signing up.");
        return;
    }

    // Prevent double booking in same time slot
    if (signupData[slot]) {
        for (let j of Object.keys(signupData[slot])) {
            if (signupData[slot][j].includes(name)) {
                alert("You already signed up for a job in this time slot.");
                return;
            }
        }
    }

    signupData[slot] = signupData[slot] || {};
    signupData[slot][job] = signupData[slot][job] || [];

    signupData[slot][job].push(name);

    renderTable();
}

function signupCleanup() {
    const name = document.getElementById("volName").value.trim();
    if (!name) {
        alert("Please enter your name before signing up.");
        return;
    }

    if (cleanupList.includes(name)) {
        alert("You already signed up for cleanup.");
        return;
    }

    if (cleanupList.length >= 4) return;

    cleanupList.push(name);
    renderTable();
}

renderTable();
</script>

</body>
</html>
